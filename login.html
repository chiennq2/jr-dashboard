<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập Jira Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>*{font-family:'Inter',sans-serif;}</style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
    <h1 class="text-xl font-bold text-slate-800 mb-2">ETC Jira Dashboard</h1>
    <p class="text-slate-500 text-sm mb-6">Đăng nhập bằng tài khoản Google đã được cấp quyền.</p>
    <a id="loginBtn" href="/api/auth/login" class="w-full inline-flex items-center justify-center px-4 py-3 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition">
      Đăng nhập Google
    </a>
  </div>
  <script>
    const q = new URLSearchParams(window.location.search);
    const next = q.get('next') || '/';
    document.getElementById('loginBtn').href = '/api/auth/login?next=' + encodeURIComponent(next);
  </script>
</body>
</html>
