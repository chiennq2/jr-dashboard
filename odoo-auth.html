<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập ETC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #030712;
      --bg-secondary: #071024;
      --text-main: #e6f6ff;
      --text-muted: #95adc4;
      --line-soft: rgba(139, 203, 255, 0.24);
      --line-strong: rgba(120, 216, 255, 0.6);
      --glass-bg: rgba(5, 14, 29, 0.66);
      --chip-bg: rgba(55, 178, 255, 0.16);
      --accent-a: #19e3ff;
      --accent-b: #3f9eff;
      --focus: rgba(80, 224, 255, 0.8);
      --shadow-main: 0 30px 90px rgba(1, 12, 28, 0.7);
      --danger: #ff7f93;
      --ok: #7ff2c5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text-main);
      background: radial-gradient(circle at 15% 20%, #10264b 0%, var(--bg-base) 45%), var(--bg-base);
      font-family: 'Manrope', sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
      isolation: isolate;
    }

    .bg-layer {
      position: fixed;
      inset: -12vmax;
      pointer-events: none;
      z-index: -5;
    }

    .network-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -2;
      opacity: 0.95;
    }

    .mesh {
      background:
        radial-gradient(circle at 14% 16%, rgba(64, 150, 255, 0.38), transparent 42%),
        radial-gradient(circle at 82% 18%, rgba(43, 226, 255, 0.3), transparent 38%),
        radial-gradient(circle at 74% 84%, rgba(36, 109, 255, 0.26), transparent 42%),
        radial-gradient(circle at 36% 70%, rgba(26, 78, 204, 0.2), transparent 36%),
        linear-gradient(140deg, #020611 0%, #07142a 50%, #030a16 100%);
      filter: blur(4px) saturate(1.14);
      animation: driftMesh 22s ease-in-out infinite alternate;
    }

    .grid {
      z-index: -4;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(142, 222, 255, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(142, 222, 255, 0.12) 1px, transparent 1px);
      background-size: 56px 56px;
      transform: perspective(980px) rotateX(66deg) scale(1.15);
      transform-origin: center 62%;
      animation: gridPulse 8s ease-in-out infinite;
    }

    .beam {
      z-index: -3;
      overflow: hidden;
      opacity: 0.65;
    }

    .beam::before {
      content: '';
      position: absolute;
      inset: -60% -40%;
      background:
        linear-gradient(
          118deg,
          transparent 34%,
          rgba(116, 214, 255, 0.08) 44%,
          rgba(125, 226, 255, 0.2) 50%,
          rgba(116, 214, 255, 0.08) 56%,
          transparent 66%
        );
      transform: translate3d(-30%, -12%, 0) rotate(-8deg);
      mix-blend-mode: screen;
      animation: beamSweep 14s cubic-bezier(.25,.45,.2,1) infinite;
    }

    .scanline::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(140, 216, 255, 0.02),
        rgba(140, 216, 255, 0.02) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: screen;
      opacity: 0.5;
    }

    .scanline {
      z-index: -1;
    }

    .noise::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.08;
      background-image: radial-gradient(rgba(255, 255, 255, 0.7) 0.55px, transparent 0.55px);
      background-size: 3px 3px;
      mix-blend-mode: soft-light;
    }

    .login-shell {
      width: min(100%, 520px);
      animation: revealRise 900ms cubic-bezier(.22,.84,.22,1) both;
    }

    .login-card {
      border: 1px solid var(--line-soft);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: linear-gradient(165deg, rgba(6, 16, 31, 0.86), rgba(5, 12, 24, 0.72));
      border-radius: 28px;
      box-shadow: var(--shadow-main);
      position: relative;
      overflow: hidden;
      animation: revealRise 900ms cubic-bezier(.22,.84,.22,1) both;
      animation-delay: 120ms;
      padding: 30px;
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: -35% auto auto -30%;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(43, 222, 255, 0.3) 0%, rgba(12, 56, 146, 0.12) 48%, transparent 72%);
      filter: blur(6px);
      animation: cinematicGlow 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .login-card .radar-ring {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 560px;
      height: 560px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(127, 217, 255, 0.12);
      box-shadow:
        0 0 0 48px rgba(52, 141, 255, 0.03),
        0 0 0 110px rgba(45, 126, 255, 0.025),
        inset 0 0 80px rgba(29, 109, 243, 0.1);
      pointer-events: none;
      animation: radarRotate 18s linear infinite;
    }

    .login-card .radar-ring::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      border-top: 2px solid rgba(129, 232, 255, 0.66);
      border-right: 2px solid transparent;
      border-bottom: 2px solid transparent;
      border-left: 2px solid transparent;
      filter: drop-shadow(0 0 12px rgba(126, 229, 255, 0.45));
    }

    .login-card::after {
      content: '';
      position: absolute;
      inset: auto -70px -90px auto;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 219, 255, 0.34), rgba(17, 82, 212, 0.16) 52%, transparent 72%);
      animation: cinematicGlowSecondary 9s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .status-chip {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--chip-bg);
      border: 1px solid var(--line-strong);
      color: #baf4ff;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 7px 12px;
      animation: revealRise 640ms ease both;
      animation-delay: 600ms;
    }

    .login-title {
      margin: 4px 0 8px;
      font-family: 'Exo 2', sans-serif;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: 0.015em;
      animation: revealRise 640ms ease both;
      animation-delay: 440ms;
    }

    .login-subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.65;
      animation: revealRise 640ms ease both;
      animation-delay: 520ms;
    }

    .login-action {
      margin-top: 26px;
      animation: revealRise 700ms ease both;
      animation-delay: 680ms;
      display: grid;
      gap: 12px;
    }

    .login-form {
      display: grid;
      gap: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: 1px solid rgba(136, 190, 255, 0.18);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      padding: 14px 14px;
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
      font: inherit;
    }

    input:focus {
      border-color: rgba(102, 207, 255, 0.64);
      box-shadow: 0 0 0 4px rgba(83, 195, 255, 0.12);
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #e8f9ff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(95deg, #0aa7de 0%, #2669ff 100%);
      box-shadow: 0 12px 30px rgba(15, 143, 224, 0.34);
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 20%, rgba(255, 255, 255, 0.25) 48%, transparent 72%);
      transform: translateX(-120%);
      transition: transform 360ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 18px 34px rgba(21, 151, 235, 0.45);
    }

    .btn:hover::before {
      transform: translateX(120%);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
      box-shadow: 0 0 0 6px rgba(100, 214, 255, 0.22);
    }

    .status {
      min-height: 22px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }

    .note {
      margin-top: 6px;
      color: #89a3be;
      font-size: 12px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    @keyframes revealRise {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes driftMesh {
      0% { transform: translate3d(-2%, -2.5%, 0) scale(1.02); }
      50% { transform: translate3d(2.8%, 3.2%, 0) scale(1.1); }
      100% { transform: translate3d(-1.8%, 2.2%, 0) scale(1.04); }
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.24; }
      50% { opacity: 0.4; }
    }

    @keyframes beamSweep {
      0% { transform: translate3d(-38%, -18%, 0) rotate(-8deg); opacity: 0; }
      12% { opacity: 0.9; }
      55% { opacity: 0.5; }
      100% { transform: translate3d(36%, 16%, 0) rotate(-8deg); opacity: 0; }
    }

    @keyframes radarRotate {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes cinematicGlow {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.5; }
      100% { transform: translate3d(-10px, -22px, 0) scale(1.08); opacity: 0.8; }
    }

    @keyframes cinematicGlowSecondary {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.45; }
      100% { transform: translate3d(14px, -18px, 0) scale(1.12); opacity: 0.75; }
    }

    @media (max-width: 640px) {
      body { padding: 16px; }

      .login-card {
        border-radius: 22px;
      }

      .login-card {
        padding: 20px;
      }

      .login-title {
        font-size: 25px;
      }

      .login-action {
        gap: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="networkCanvas" class="network-canvas" aria-hidden="true"></canvas>
  <div class="bg-layer mesh"></div>
  <div class="bg-layer grid"></div>
  <div class="bg-layer beam"></div>
  <div class="bg-layer scanline noise"></div>

  <main class="login-shell" aria-label="Đăng nhập SSO">
    <section class="login-card">
      <div class="radar-ring" aria-hidden="true"></div>
      <p class="status-chip">Secure Channel Established</p>
      <h2 class="login-title">Đăng nhập SSO</h2>
      <p class="login-subtitle">
        Nhập account và password theo tài khoản ETC.
      </p>

      <div class="login-action">
        <form id="loginForm" class="login-form">
          <div id="loginStep">
            <div>
              <label for="account">Account</label>
              <input id="account" name="account" type="email" placeholder="user@etc.vn" autocomplete="username" required />
            </div>
            <div>
              <label for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
            </div>

            <input id="deviceId" name="device_id" type="hidden" />
            <input id="platformType" name="platform_type" type="hidden" value="android" />

            <button id="loginBtn" class="btn" type="submit">Đăng nhập SSO</button>
            <div class="note">Chỉ hỗ trợ tài khoản ETC</div>
          </div>

          <div id="otpForm" class="hidden">
            <div>
              <label for="otpCode">Mã OTP</label>
              <input id="otpCode" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="6" />
            </div>

            <button id="otpBtn" class="btn" type="submit">Xác thực OTP</button>
            <button id="backBtn" class="btn" type="button" style="margin-top: 10px; background: linear-gradient(95deg, rgba(57, 74, 100, 0.95) 0%, rgba(27, 41, 66, 0.95) 100%); box-shadow: none;">Quay lại</button>
            <div class="note">Sử dụng OTP eGen để xác thực.</div>
          </div>

          <div id="status" class="status"></div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const otpBtn = document.getElementById('otpBtn');
    const otpCode = document.getElementById('otpCode');
    const backBtn = document.getElementById('backBtn');
    const statusEl = document.getElementById('status');
    const deviceIdInput = document.getElementById('deviceId');
    const platformTypeInput = document.getElementById('platformType');
    const loginStep = document.getElementById('loginStep');
    const otpStep = document.getElementById('otpForm');
    const accountInput = document.getElementById('account');
    const passwordInput = document.getElementById('password');
    let pendingTwoFactor = false;

    function setStatus(message, type) {
      statusEl.textContent = message || '';
      statusEl.className = type ? `status ${type}` : 'status';
    }

    function getCompanyType(account) {
      const value = String(account || '').trim().toLowerCase();
      const atIndex = value.lastIndexOf('@');
      const domain = atIndex >= 0 ? value.slice(atIndex + 1) : '';
      if (domain === 'etc.vn' || domain.endsWith('.etc.vn')) {
        return 'etc.vn';
      }
      // if (domain === 'epayjsc.com' || domain.endsWith('.epayjsc.com')) {
      //   return 'epayjsc.com';
      // }
      return '';
    }

    function isBusinessAccount(account) {
      return Boolean(getCompanyType(account));
    }

    function showOtpStep(message) {
      pendingTwoFactor = true;
      if (loginStep) loginStep.classList.add('hidden');
      if (otpStep) otpStep.classList.remove('hidden');
      loginBtn.disabled = false;
      otpBtn.disabled = false;
      if (message) {
        setStatus(message, '');
      }
      window.setTimeout(() => otpCode.focus(), 0);
    }

    function showLoginStep(message) {
      pendingTwoFactor = false;
      if (otpStep) otpStep.classList.add('hidden');
      if (loginStep) loginStep.classList.remove('hidden');
      if (message) {
        setStatus(message, '');
      }
      window.setTimeout(() => accountInput.focus(), 0);
    }

    function getOrCreateDeviceId() {
      const storageKey = 'odoo_device_id';
      try {
        const stored = window.localStorage.getItem(storageKey);
        if (stored) return stored;
      } catch (error) {
        // Ignore storage failures and fall back to an in-memory ID.
      }

      const randomPart = window.crypto && typeof window.crypto.randomUUID === 'function'
        ? window.crypto.randomUUID().slice(0, 8)
        : Math.random().toString(36).slice(2, 10);
      const deviceId = `web-${randomPart}`;

      try {
        window.localStorage.setItem(storageKey, deviceId);
      } catch (error) {
        // Ignore storage failures; the generated ID still works for this session.
      }

      return deviceId;
    }

    async function readJson(response) {
      const text = await response.text();
      try {
        return text ? JSON.parse(text) : {};
      } catch (error) {
        return { ok: false, message: text || error.message };
      }
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (pendingTwoFactor) {
        otpBtn.disabled = true;
        setStatus('Đang xác thực OTP...', '');
        try {
          let pendingToken = '';
          try {
            pendingToken = window.sessionStorage.getItem('odoo_pending_token') || '';
          } catch (error) {
            pendingToken = '';
          }
          const response = await fetch('/api/odoo/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              otp: otpCode.value.trim(),
              pending_token: pendingToken,
              account: accountInput.value.trim()
            })
          });
          const data = await readJson(response);

          if (!response.ok || !data.ok) {
            setStatus(data.message || 'Xác thực OTP thất bại.', 'error');
            return;
          }

          try {
            window.sessionStorage.removeItem('odoo_pending_token');
            window.sessionStorage.setItem('odoo_session_token', data.token || '');
          } catch (error) {
            // Ignore storage failures.
          }
          setStatus('Đăng nhập thành công. Đang chuyển sang dashboard...', 'ok');
          window.setTimeout(() => {
            var redirectUrl = 'jira-dashboard.html';
            if (window.location.protocol === 'file:') {
              var fileRedirect = new URL(redirectUrl, window.location.href);
              fileRedirect.hash = 'odoo_token=' + encodeURIComponent(data.token || '');
              window.location.href = fileRedirect.toString();
              return;
            }
            window.location.href = redirectUrl;
          }, 180);
        } catch (error) {
          setStatus(error.message || 'Không thể gọi API xác thực OTP.', 'error');
        } finally {
          otpBtn.disabled = false;
        }
        return;
      }

      loginBtn.disabled = true;
      setStatus('Đang đăng nhập SSO...', '');

      const formData = new FormData(loginForm);
      const payload = Object.fromEntries(formData.entries());
      payload.platform_type = 'android';
      payload.type = 'android';
      payload.device_id = deviceIdInput.value || getOrCreateDeviceId();
      payload.company_type = getCompanyType(payload.account);

      if (!isBusinessAccount(payload.account)) {
        setStatus('SSO Login chỉ hỗ trợ tài khoản `@etc.vn`.', 'error');
        loginBtn.disabled = false;
        return;
      }

      try {
        const response = await fetch('/api/odoo/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload)
        });
        const data = await readJson(response);

        if (!response.ok || !data.ok) {
          setStatus(data.message || 'Đăng nhập thất bại.', 'error');
          return;
        }

        if (data.requiresTwoFactor) {
          if (data.pendingToken) {
            try {
              window.sessionStorage.setItem('odoo_pending_token', data.pendingToken);
            } catch (error) {
              // Ignore storage failures and continue with in-memory state.
            }
          }
          showOtpStep('Đăng nhập bước 1 thành công. Vui lòng nhập mã OTP.');
          return;
        }

        setStatus('Đăng nhập thành công.', 'ok');
        loginForm.reset();
        deviceIdInput.value = payload.device_id;
        platformTypeInput.value = 'android';
        passwordInput.focus();
      } catch (error) {
        setStatus(error.message || 'Không thể gọi API đăng nhập.', 'error');
      } finally {
        loginBtn.disabled = false;
      }
    });

    backBtn.addEventListener('click', () => {
      otpCode.value = '';
      try {
        window.sessionStorage.removeItem('odoo_pending_token');
        window.sessionStorage.removeItem('odoo_session_token');
      } catch (error) {
        // Ignore storage failures.
      }
      showLoginStep('Bạn có thể nhập lại tài khoản ETC để đăng nhập.');
    });

    deviceIdInput.value = getOrCreateDeviceId();
    platformTypeInput.value = 'android';
    showLoginStep();

    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let nodes = [];
    let animationFrame = null;
    let width = 0;
    let height = 0;
    let dpr = 1;

    function resizeNetwork() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = Math.min(150, Math.max(76, Math.floor((width * height) / 9500)));
      nodes = Array.from({ length: count }, (_, index) => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.11,
        vy: (Math.random() - 0.5) * 0.11,
        r: index % 7 === 0 ? 2.2 : 1.35,
        phase: Math.random() * Math.PI * 2
      }));

      drawNetwork(0);
    }

    function drawNetwork(time) {
      ctx.clearRect(0, 0, width, height);
      ctx.lineCap = 'round';

      const linkDistance = Math.min(250, Math.max(170, width * 0.17));
      const pulse = (Math.sin(time * 0.0012) + 1) / 2;

      for (let i = 0; i < nodes.length; i++) {
        const node = nodes[i];

        if (!reducedMotion) {
          node.x += node.vx;
          node.y += node.vy;

          if (node.x < -20) node.x = width + 20;
          if (node.x > width + 20) node.x = -20;
          if (node.y < -20) node.y = height + 20;
          if (node.y > height + 20) node.y = -20;
        }

        for (let j = i + 1; j < nodes.length; j++) {
          const other = nodes[j];
          const dx = node.x - other.x;
          const dy = node.y - other.y;
          const distance = Math.hypot(dx, dy);

          if (distance < linkDistance) {
            const alpha = (1 - distance / linkDistance) * 0.28;
            const gradient = ctx.createLinearGradient(node.x, node.y, other.x, other.y);
            gradient.addColorStop(0, `rgba(37, 211, 255, ${alpha})`);
            gradient.addColorStop(0.5, `rgba(115, 242, 255, ${alpha + pulse * 0.06})`);
            gradient.addColorStop(1, `rgba(72, 132, 255, ${alpha * 0.75})`);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            ctx.moveTo(node.x, node.y);
            ctx.lineTo(other.x, other.y);
            ctx.stroke();
          }
        }
      }

      for (const node of nodes) {
        const glow = 0.45 + Math.sin(time * 0.002 + node.phase) * 0.18;
        ctx.beginPath();
        ctx.fillStyle = `rgba(168, 246, 255, ${glow})`;
        ctx.shadowColor = 'rgba(33, 218, 255, 0.7)';
        ctx.shadowBlur = 12;
        ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      if (!reducedMotion) {
        animationFrame = requestAnimationFrame(drawNetwork);
      }
    }

    resizeNetwork();
    window.addEventListener('resize', resizeNetwork);
    window.addEventListener('beforeunload', () => {
      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
      }
    });
  </script>
</body>
</html>
